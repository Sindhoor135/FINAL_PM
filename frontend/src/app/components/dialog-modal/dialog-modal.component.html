<div *ngIf="dialog?.visible" class="dialog-overlay">
  <div class="dialog-box">
    <div class="dialog-header">
      <h3>{{ dialog?.title }}</h3>
    </div>
    <div class="dialog-body">
      <p>{{ dialog?.message }}</p>
      <div *ngIf="dialog?.type === 'prompt'" class="dialog-input-wrapper">
        <input
          type="text"
          [(ngModel)]="inputValue"
          [placeholder]="promptPlaceholder"
          class="dialog-input"
        />

      </div>
    </div>
    <div class="dialog-actions">
      <button class="dialog-button cancel" (click)="cancel()">{{ dialog?.cancelText }}</button>
      <button class="dialog-button confirm" (click)="confirm()">{{ dialog?.confirmText }}</button>
    </div>
  </div>
</div>
